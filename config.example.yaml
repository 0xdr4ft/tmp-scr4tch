project_id: my-gcp-project          # also fills :p_gcp_project in sql_gcp
location: europe-west4
report_dir: ./reports

# Catalogue of test cases. ORACLE_META_USER / ORACLE_META_PASSWORD, or asked.
oracle_meta:
  label: metadata
  host: meta-host.example.com
  port: 1521
  service_name: METASVC
  tests_view: V_TEST_DEFINITIONS
  columns:                          # as the view names them
    table_name: TABLE_NAME
    test_case: TEST_CASE
    sql_oracle: SQL_ORACLE
    sql_gcp: SQL_GCP
  table_registry: TABLE_REGISTRY    # per-table load metadata: cron, extract, source
  registry_columns:                 # as the registry names them
    table_name: TABLE_NAME
    cron_table: LOAD_CRON
    extract_method: EXTRACT_METHOD  # optional: FULL / INCREMENTAL, shown in the report
    source_name: SOURCE_NAME        # joins the table to the source registry
  source_registry: SOURCE_REGISTRY  # each source and its type
  source_columns:
    source_name: SOURCE_NAME
    source_type: SOURCE_TYPE

# Every sql_oracle runs here. ORACLE_USER / ORACLE_PASSWORD, or asked.
oracle:
  label: source
  host: oracle-host.example.com
  port: 1521
  service_name: ORCLSVC

airflow:
  enabled: true
  base_url: https://xxxxxxxx.composer.googleusercontent.com
  api_version: v2
  verify_ssl: false                 # corporate network inspects TLS
  dag_id_prefix: LOAD_              # <dag_id_prefix><SCHEMA_><TABLE>
  dataset_layer_prefixes: [bronze_] # bronze_sys in sql_gcp -> SYS_ in the dag_id
  dag_id_strip_suffixes: [_TMP]
  history_runs: 10
  min_success_ratio_pct: 80
  duration_factor: 2.0
  # :p_last_airflow_run: which moment of the last successful run, in which zone.
  last_run_field: start_date        # start_date | end_date | logical_date
  last_run_tz: local                # utc | local, as the compared columns keep it

# Framework -> its source types, matched any case. Read from the metadata.
frameworks:
  FRAMEWORK_A: [SOURCE_TYPE_A]
  FRAMEWORK_B: [SOURCE_TYPE_B, SOURCE_TYPE_C]

# Which of them this build tests, and how. `compare` needs a source and the test
# catalogue; `standalone` asks the target alone. Anything else is skipped.
implemented_frameworks:
  FRAMEWORK_A: compare
  FRAMEWORK_B: standalone

# For the standalone frameworks: where the tables are and what counts as fresh.
standalone:
  layers: [BRONZE, SILVER, GOLD]
  dataset_pattern: "{layer}_{system}"   # dataset holding one layer of one system
  lowercase_datasets: true
  table_suffixes: [_raw, _std]
  hours: 24                             # the window for ROWS_LAST_HOURS
  min_rows: 1                           # fewer than this in the window is a FAIL
  max_age_hours: 24                     # newest row older than this is a FAIL
  loaded_at_columns: [AUDIT_INSERT_TS, LOADED_AT, INSERT_TS]

# Where results go, on the oracle_meta connection. Off until the user has INSERT.
results:
  enabled: false
  environment: PROD                 # DEV | TEST | PROD
  runs_table: TEST_CASE_RUNS        # header: one row per table per run
  results_table: TEST_CASE_RESULTS  # one row per check
  runs_column_prefix: RUN_          # every column is <prefix><NAME>
  results_column_prefix: RES_

# Tolerance = largest gap in the table's own cron + buffer; no cron = SKIP.
cron_tolerance_cases: [MAX_TIMESTAMP]   # as the catalogue spells them
tolerance_buffer_hours: 0.5             # covers the run itself, a late start, skew

defaults:
  date_from: 2026-06-01             # start offered at the prompt; end = yesterday
  max_compare_rows: 50000           # bigger results are reported, not compared
  float_decimals: 6                 # rounding before the two sides are compared
  timestamp_decimals: 3             # digits of a second kept: Oracle keeps 6,
                                    # BigQuery 3, and the rest is storage noise
