project_id: my-gcp-project          # also fills :p_gcp_project in sql_gcp
location: europe-west4
report_dir: ./reports

# Catalogue of test cases. ORACLE_META_USER / ORACLE_META_PASSWORD, or asked.
oracle_meta:
  label: metadata
  host: meta-host.example.com
  port: 1521
  service_name: METASVC
  tests_view: V_TEST_DEFINITIONS
  columns:                          # as the view names them
    table_name: TABLE_NAME
    test_case: TEST_CASE
    sql_oracle: SQL_ORACLE
    sql_gcp: SQL_GCP
  schedule_table: TABLE_REGISTRY    # registry holding each table's Airflow cron
  schedule_columns:                 # as the registry names them
    table_name: TABLE_NAME
    cron_table: LOAD_CRON

# Every sql_oracle runs here. ORACLE_USER / ORACLE_PASSWORD, or asked.
oracle:
  label: source
  host: oracle-host.example.com
  port: 1521
  service_name: ORCLSVC

airflow:
  enabled: true
  base_url: https://xxxxxxxx.composer.googleusercontent.com
  api_version: v2
  verify_ssl: false                 # corporate network inspects TLS
  dag_id_prefix: LOAD_              # <dag_id_prefix><SCHEMA_><TABLE>
  dataset_layer_prefixes: [bronze_] # bronze_sys in sql_gcp -> SYS_ in the dag_id
  dag_id_strip_suffixes: [_TMP]
  history_runs: 10
  min_success_ratio_pct: 80
  duration_factor: 2.0

# Test cases whose two sides are never read at the same moment: the source keeps
# moving while bronze waits for its next load, so the newest row is newer there
# until that load lands. Their tolerance is the largest gap in the table's own
# cron (from oracle_meta.schedule_table) plus the buffer below - the buffer
# covers the run itself, a late start and clock skew. A table with no readable
# schedule is SKIPPED, never guessed at. Every other test case has to match
# exactly.
cron_tolerance_cases: [MAX_TIMESTAMP]   # the test case names, as the catalogue spells them
tolerance_buffer_hours: 0.5

defaults:
  date_from: 2026-06-01             # start offered at the prompt; end = yesterday
  max_compare_rows: 50000           # bigger results are reported, not compared
  float_decimals: 6                 # rounding before the two sides are compared
  timestamp_decimals: 3             # digits of a second kept: Oracle keeps 6,
                                    # BigQuery 3, and the rest is storage noise
