[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[project]
name = "loading-tests"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "google-cloud-bigquery",
    "pyyaml",
    "oracledb",
]

[project.scripts]
# The name you type in the terminal. Rename it, then run `uv pip install -e .`
# again - the command is created at install time.
loading-tests = "loading_tests:main"
